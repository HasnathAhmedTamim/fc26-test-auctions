# Deploy the FULL app here for live Socket.IO auction (Vercel alone cannot run websockets).
# Dashboard: https://dashboard.render.com → New → Blueprint → connect repo
services:
  - type: web
    name: fc26-auction
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://fc26-test-auctions.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        value: https://fc26-test-auctions.onrender.com
      - key: MONGODB_DNS_SERVERS
        value: 8.8.8.8,1.1.1.1
